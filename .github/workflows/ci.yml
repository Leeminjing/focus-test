name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==9.0.3
      - name: Check formatting
        shell: pwsh
        run: |
          $unformatted = gofmt -l .
          if ($unformatted) { $unformatted; exit 1 }
      - run: go vet ./...
      - run: go test ./...
      - run: python -m unittest discover -s integration/focus -v
      - run: go build ./cmd/...
      - name: Race detector
        if: runner.os == 'Linux'
        run: go test -race ./...
